name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # sentence-transformers downloads its model from the HuggingFace Hub the
      # first time it's used (most of test_scoring.py runs real embeddings,
      # per its own docstring) — cache it so CI isn't a slow, rate-limited
      # re-download on every run. Keyed off pyproject.toml (which pins the
      # sentence-transformers version) so a dependency bump gets a fresh cache
      # entry instead of reusing a stale one forever under a fixed key;
      # restore-keys falls back to the closest prior cache to warm from when
      # the exact key is new.
      - name: Cache HuggingFace model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-all-MiniLM-L6-v2-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            huggingface-all-MiniLM-L6-v2-

      - name: Type check
        run: mypy src/skillproof

      - name: Test
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Folded in from the old standalone docker-smoke-test.yml: GitHub Actions
    # `needs:` can't reference a job in a different workflow file, so a
    # failure there could never actually block `deploy` below — only a job in
    # this same file can.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: skillproof
          POSTGRES_PASSWORD: skillproof
          POSTGRES_DB: skillproof
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t skillproof:ci .

      - name: Boot container
        # Boots with a throwaway, CI-only production-shaped config (a
        # real-format Fernet key, dummy GitHub OAuth creds, the postgres
        # service above) instead of the permissive development defaults —
        # production (Railway) never runs those defaults, so a smoke test
        # that always exercised them proved little. --network host so the
        # container can reach the postgres service on the runner's own
        # localhost, same as this step's later curl does for port 8000.
        run: |
          fernet_key=$(openssl rand -base64 32 | tr '+/' '-_')
          docker run -d --name skillproof-smoke --network host \
            -e SKILLPROOF_ENVIRONMENT=production \
            -e SKILLPROOF_TOKEN_ENCRYPTION_KEY="$fernet_key" \
            -e SKILLPROOF_GITHUB_CLIENT_ID=ci-smoke-client-id \
            -e SKILLPROOF_GITHUB_CLIENT_SECRET=ci-smoke-client-secret \
            -e DATABASE_URL=postgresql://skillproof:skillproof@localhost:5432/skillproof \
            skillproof:ci

      - name: Wait for health check
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health >/dev/null; then
              echo "Health check passed"
              exit 0
            fi
            if ! docker inspect -f '{{.State.Running}}' skillproof-smoke 2>/dev/null | grep -q true; then
              echo "::error::Container exited before becoming healthy"
              exit 1
            fi
            sleep 2
          done
          echo "::error::Health check never passed within the timeout"
          exit 1

      - name: Container logs
        if: always()
        run: docker logs skillproof-smoke || true

      - name: Stop container
        if: always()
        run: docker rm -f skillproof-smoke || true

  deploy:
    needs: [backend, frontend, docker-smoke]
    # Scoped to the ref so two overlapping pushes to main can't both reach
    # `railway up` at once — without this, a slower older run finishing after
    # a faster newer one would silently leave the older commit's build live.
    # cancel-in-progress means the newer push wins outright instead of the
    # two racing.
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: true
    # A custom `if:` replaces the job's implicit default (`success()`)
    # entirely rather than ANDing with it, so success() must be spelled out
    # here — without it, this job would still run after a failed backend or
    # frontend job as long as the push was to main. Railway's own "Wait for
    # CI" deploy gate is reported unreliable, so the test-then-deploy gate is
    # enforced here instead, via this condition plus `needs:` above.
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Pinned rather than left floating on latest so a Railway CLI release
      # can't silently change deploy behavior mid-pipeline. Bump this
      # deliberately (Dependabot's github-actions ecosystem only tracks
      # `uses:` steps, not an npm package installed via `run:`, so this needs
      # a manual version bump here when a newer CLI is wanted).
      - name: Install Railway CLI
        run: npm install -g @railway/cli@5.49.3

      - name: Stamp the build with this commit
        # Overwrites the committed placeholder ("unknown") so the Dockerfile's
        # existing `COPY src/ ./src/` bakes this commit into the image and
        # /health can report which commit is actually running. The file is
        # tracked, not gitignored, precisely because `railway up` honors
        # .gitignore when packaging its upload — an ignored stamp never
        # reaches the build it exists to identify.
        run: echo "${GITHUB_SHA}" > src/skillproof/_build_sha.txt

      - name: Deploy
        # --service is required: the project also has a Postgres addon
        # service, so `railway up` alone is ambiguous about which one to
        # build and deploy.
        run: railway up --service SkillProof
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Verify the deploy actually rolled out
        # `railway up` returns once its upload is accepted, so the step above
        # going green proves nothing about what production is serving: a
        # Railway build that fails, is queued, or is blocked (e.g. exhausted
        # trial credits) leaves the previous container running with every CI
        # check still passing. That really happened — 3103c70 and 4601cab both
        # reported a successful deploy while production kept serving 5f7c17f,
        # so an already-fixed crash stayed live in production. Polling /health
        # for this exact commit is what turns that silent no-op into a red
        # pipeline.
        run: |
          for i in $(seq 1 40); do
            live=$(curl -fsS --max-time 10 https://skillproof.up.railway.app/health \
              | python3 -c "import sys, json; print(json.load(sys.stdin).get('git_sha', ''))" 2>/dev/null || true)
            if [ "$live" = "$GITHUB_SHA" ]; then
              echo "Production is serving $GITHUB_SHA"
              exit 0
            fi
            echo "waiting for rollout — production is serving: ${live:-unreachable}"
            sleep 15
          done
          echo "::error::Production never served $GITHUB_SHA. Check the Railway build logs and the project's plan/credits."
          exit 1

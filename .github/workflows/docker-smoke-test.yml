name: Docker build & boot smoke test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docker-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t skillproof:ci .

      - name: Boot container
        run: docker run -d --name skillproof-smoke -p 8000:8000 skillproof:ci

      - name: Wait for health check
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/ >/dev/null; then
              echo "Health check passed"
              exit 0
            fi
            if ! docker inspect -f '{{.State.Running}}' skillproof-smoke 2>/dev/null | grep -q true; then
              echo "::error::Container exited before becoming healthy"
              exit 1
            fi
            sleep 2
          done
          echo "::error::Health check never passed within the timeout"
          exit 1

      - name: Container logs
        if: always()
        run: docker logs skillproof-smoke || true

      - name: Stop container
        if: always()
        run: docker rm -f skillproof-smoke || true
